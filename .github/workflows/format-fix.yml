# TẠM: chạy Prettier đúng phiên bản trong lockfile, ghi kết quả lint, rồi commit ngược về nhánh. Xóa sau khi dùng.
name: format fix (tạm)

on:
  push:
    paths: ['.github/workflows/format-fix.yml']

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    env:
      A: node .github/scripts/annotate.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prettier --write
        run: |
          npm run format >/dev/null
          $A "format diff" "git diff --stat"
      - name: Lint
        continue-on-error: true
        run: $A "lint" "npx eslint . 2>&1 | grep -E 'error|problems' | tail -40; npx eslint . > /dev/null 2>&1"
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A .
          git diff --cached --quiet || { git commit -qm "style: Prettier (bản trong lockfile)"; git push; }
