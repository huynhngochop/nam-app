# TẠM (xóa trước khi gộp): chạy prettier bản của dự án rồi commit, vì máy làm việc không có đúng phiên bản prettier.
name: Format sync (tạm)

on:
  push:
    branches: [feat/meo-nha-579]
    paths: ['.github/workflows/format-sync.yml']

permissions:
  contents: write

jobs:
  fmt:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: prettier --write rồi commit nếu đổi
        run: |
          npx prettier --write "**/*.{ts,tsx,js,mjs,cjs}" > /dev/null
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "::notice title=fmt::không đổi"; exit 0; fi
          git diff --stat
          git commit -am "chore: định dạng bằng prettier của dự án"
          git push
          echo "::notice title=fmt::đã định dạng"
