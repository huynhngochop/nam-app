# Workflow TẠM: cài thư viện, đồng bộ phiên bản Expo SDK 54, typecheck, test, liên kết dự án EAS,
# rồi commit thay đổi (package.json, package-lock.json, app.json) ngược về nhánh này.
# Sẽ xóa trước khi merge.
name: bootstrap (tạm)

on:
  push:
    branches: [ci/eas-build-android]
    paths: ['.github/workflows/bootstrap.yml', '.github/bootstrap-trigger']

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      A: node .github/scripts/annotate.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: npm install
        run: $A "npm install" npm install --no-audit --no-fund

      - name: expo install --fix
        continue-on-error: true
        run: |
          for a in meo-nha nhip hen-dep vi-gon; do
            $A "expo fix $a" "cd apps/$a && npx expo install --fix"
          done

      - name: npm install (cập nhật lockfile)
        run: $A "npm install 2" npm install --no-audit --no-fund

      - name: expo install --check
        continue-on-error: true
        run: |
          for a in meo-nha nhip hen-dep vi-gon; do
            $A "expo check $a" "cd apps/$a && npx expo install --check"
          done

      - name: typecheck
        continue-on-error: true
        run: $A "typecheck" npm run typecheck

      - name: test
        continue-on-error: true
        run: $A "test" npm test

      - name: eas whoami
        continue-on-error: true
        run: $A "eas whoami" "npx -y eas-cli@latest whoami"

      - name: eas init
        continue-on-error: true
        run: |
          for a in meo-nha nhip hen-dep vi-gon; do
            $A "eas init $a" "cd apps/$a && npx -y eas-cli@latest init --non-interactive --force"
          done

      - name: diff
        run: $A "diff" "git status --short && git diff --stat && git diff -- apps/*/app.json apps/*/package.json packages/*/package.json package.json"

      - name: commit ngược về nhánh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json apps/*/package.json apps/*/app.json apps/*/eas.json packages/*/package.json
          git diff --cached --quiet && echo "không có gì để commit" || {
            git commit -m "chore: đồng bộ thư viện Expo SDK 54, lockfile và liên kết dự án EAS (tự động)"
            git push
          }
