# TẠM (xóa trước khi gộp): cập nhật package-lock.json và định dạng bằng prettier của dự án,
# vì máy làm việc không vào được npm.
name: Sync (tạm)

on:
  push:
    branches: [perf/lean-apk]
    paths: ['.github/workflows/sync-tmp.yml']

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --package-lock-only --no-audit --no-fund
      - run: npm ci --no-audit --no-fund
      - run: npx prettier --write "**/*.{ts,tsx,js,mjs,cjs}" > /dev/null
      - name: Commit nếu đổi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then echo "::notice title=sync::không đổi"; exit 0; fi
          git diff --stat
          git commit -am "chore: cập nhật package-lock.json, định dạng"
          git push
