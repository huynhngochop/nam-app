# Kiểm thử Thành Tâm đủ các tầng: UT, IT (typecheck thật, bundle iOS/Android, crawler web dữ liệu lớn),
# ST (20 cỡ màn web; Android emulator: điện thoại, máy gập, tablet, xoay, chữ 200 %, nền tối; iOS Simulator: iPhone, iPad),
# UAT (14 hành trình người dùng). Job apk đăng bản cài Android lên Releases (thanh-tam-latest). Kết quả đẩy lên nhánh qa-results-tt.
name: Thành Tâm QA

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'all: chạy đủ; back: chỉ build và thử nút Quay lại trên emulator; store: chỉ build và chụp ảnh cho trang Google Play'
        default: all
        type: choice
        options: [all, back, store]
      play_track:
        description: 'Kênh Google Play khi đã có secret PLAY_SERVICE_ACCOUNT_JSON (internal, alpha = thử kín, production)'
        default: internal
        type: choice
        options: [internal, alpha, production]
      play_status:
        description: 'draft khi app trên Play chưa phát hành lần nào; completed để phát hành ngay'
        default: draft
        type: choice
        options: [draft, completed]
  push:
    branches: [feat/thanh-tam]

permissions:
  contents: write

concurrency:
  group: thanh-tam-qa-${{ github.ref }}
  cancel-in-progress: true

env:
  A: node .github/scripts/annotate.mjs

jobs:
  prep:
    name: Đồng bộ lockfile, phiên bản Expo, định dạng
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: expo install --fix (Thành Tâm)
        run: $A "expo install" "cd apps/thanh-tam && npx expo install --fix 2>&1 | tail -30"
      - run: npm install --no-audit --no-fund
      - name: Định dạng + sửa lint tự động
        run: |
          npx prettier --write "apps/thanh-tam/**/*.{ts,tsx,js}" "packages/**/*.{ts,tsx}" "tests/**/*.ts" "qa/**/*.{mjs,tsx}" >/dev/null
          npx eslint apps/thanh-tam qa tests --fix || true
      - id: push
        name: Đẩy thay đổi (nếu có)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git diff --cached --stat | tail -20
            git commit -qm "chore(thanh-tam): đồng bộ lockfile, phiên bản Expo SDK 54, định dạng (tự động)"
            git push -q origin HEAD:${{ github.ref_name }}
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  check:
    name: UT + IT (lint, kiểu, test, bundle iOS/Android)
    needs: prep
    if: inputs.only != 'back' && inputs.only != 'store'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prep.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: $A "lint" npm run lint
      - name: Định dạng
        if: ${{ !cancelled() }}
        run: $A "format" npm run format:check
      - name: Typecheck thật (mọi app)
        if: ${{ !cancelled() }}
        run: $A "typecheck" npm run typecheck
      - name: Unit test (giờ Việt Nam)
        if: ${{ !cancelled() }}
        run: $A "test VN" "TZ=Asia/Ho_Chi_Minh npm test"
      - name: Unit test (máy ở Mỹ, UTC−5)
        if: ${{ !cancelled() }}
        run: $A "test UTC-5" "TZ=America/New_York npm test"
      - name: Bundle Android + iOS (Metro resolve mọi module)
        if: ${{ !cancelled() }}
        run: |
          $A "bundle android" "cd apps/thanh-tam && npx expo export -p android --output-dir /tmp/tt-android 2>&1 | tail -15"
          $A "bundle ios" "cd apps/thanh-tam && npx expo export -p ios --output-dir /tmp/tt-ios 2>&1 | tail -15"
          du -sh /tmp/tt-android /tmp/tt-ios

  web:
    name: Web · ${{ matrix.kind }}
    needs: prep
    if: inputs.only != 'back' && inputs.only != 'store'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        kind: [crawl, viewports-uat]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prep.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Bản build QA
        run: |
          cp qa/seeds/thanh-tam.tsx apps/thanh-tam/app/qa-seed.tsx
          cat > apps/thanh-tam/metro.config.js <<'EOF'
          const { getDefaultConfig } = require('expo/metro-config');
          const config = getDefaultConfig(__dirname);
          config.resolver.assetExts.push('wasm');
          config.resolver.unstable_enablePackageExports = false;
          module.exports = config;
          EOF
      - name: Export web
        run: $A "export web" "cd apps/thanh-tam && npx expo export -p web --clear --output-dir dist-web 2>&1 | tail -25"
      - name: Cài Playwright
        run: |
          mkdir -p /tmp/pw && cp qa/*.mjs /tmp/pw/
          (cd /tmp/pw && npm init -y >/dev/null && npm i --no-audit --no-fund playwright@1.56.1 >/dev/null)
          (cd /tmp/pw && npx playwright install --with-deps chromium >/dev/null)
      - name: Crawler bấm mọi nút với 1.000 ngày giỗ
        if: matrix.kind == 'crawl'
        run: |
          node qa/serve.mjs apps/thanh-tam/dist-web 8080 &
          sleep 2
          QA_SEED=1 QA_BUDGET_MIN=80 QA_MAX_CLICKS=40 $A "crawl" node /tmp/pw/crawl.mjs thanh-tam http://localhost:8080 qa-out/web-crawl
      - name: 20 cỡ màn + UAT
        if: matrix.kind == 'viewports-uat'
        run: |
          node qa/serve.mjs apps/thanh-tam/dist-web 8080 &
          sleep 2
          $A "uat" node /tmp/pw/uat-thanh-tam.mjs http://localhost:8080 qa-out/web-uat
          $A "viewports" node /tmp/pw/viewports.mjs "$PWD/qa/thanh-tam-routes.json" http://localhost:8080 qa-out/web-viewports
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tt-web-${{ matrix.kind }}
          path: qa-out
          if-no-files-found: ignore

  android:
    name: Android emulator (điện thoại, gập, tablet)
    needs: prep
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prep.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --no-audit --no-fund
      - name: Prebuild
        run: |
          cp qa/seeds/thanh-tam.tsx apps/thanh-tam/app/qa-seed.tsx
          $A "prebuild android" "cd apps/thanh-tam && npx expo prebuild -p android --clean --no-install 2>&1 | tail -20"
          bash .github/scripts/gradle-dist.sh apps/thanh-tam/android
      - name: Nút Quay lại phải tới được JS (không bật cử chỉ quay lại dự đoán)
        run: |
          M=apps/thanh-tam/android/app/src/main/AndroidManifest.xml
          if grep -q 'enableOnBackInvokedCallback="true"' "$M"; then
            echo "::error::enableOnBackInvokedCallback=true: Android không gửi nút Quay lại cho BackHandler, app thoát ngay. Đặt predictiveBackGestureEnabled=false trong app.json"
            exit 1
          fi
          grep -o 'enableOnBackInvokedCallback="[a-z]*"' "$M" || echo "không khai (mặc định tắt trên Android 13–15)"
      - name: Build APK release (x86_64)
        run: $A "gradle" "bash .github/scripts/gradle-retry.sh apps/thanh-tam/android assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon -q"
      - name: Bật KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Chạy trên emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: BACK_ONLY=${{ inputs.only == 'back' && '1' || '0' }} STORE_ONLY=${{ inputs.only == 'store' && '1' || '0' }} bash qa/native/android.sh apps/thanh-tam/android/app/build/outputs/apk/release/app-release.apk qa-out/android
      - name: Đăng ảnh gốc cho trang Google Play (thanh-tam-store)
        if: inputs.only == 'store'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd qa-out/android/store && zip -q ../store-shots.zip *.png && cd -
          gh release view thanh-tam-store >/dev/null 2>&1 || gh release create thanh-tam-store --prerelease --title "Thành Tâm · ảnh cho Google Play" --notes "Ảnh chụp gốc từ máy ảo Pixel 6 để làm trang Google Play." --target "${{ needs.prep.outputs.sha }}"
          gh release upload thanh-tam-store qa-out/android/store-shots.zip --clobber
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tt-android
          path: qa-out
          if-no-files-found: ignore

  ios:
    name: iOS Simulator (iPhone, iPad)
    needs: prep
    if: inputs.only != 'back' && inputs.only != 'store'
    runs-on: macos-15
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prep.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Prebuild (CocoaPods)
        run: |
          cp qa/seeds/thanh-tam.tsx apps/thanh-tam/app/qa-seed.tsx
          $A "prebuild ios" "cd apps/thanh-tam && npx expo prebuild -p ios --clean 2>&1 | tail -30"
      - name: Build Release cho Simulator
        run: |
          cd apps/thanh-tam/ios
          WS=$(ls -d *.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          echo "workspace $WS, scheme $SCHEME"
          set -o pipefail
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO COMPILER_INDEX_STORE_ENABLE=NO build 2>&1 | grep -E "error:|warning: .*deprecated|BUILD (SUCCEEDED|FAILED)" | tail -60
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Cài Maestro (tự động hóa giao diện, bấm được hộp "Open in …" của iOS)
        run: |
          curl -fsSL "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
      - name: Chạy trên Simulator
        env:
          # Máy ảo đầu tiên khởi động chậm: trình điều khiển Maestro quá giờ chờ mặc định (từng gặp với iPhone SE).
          MAESTRO_DRIVER_STARTUP_TIMEOUT: 240000
        run: |
          APP=$(find apps/thanh-tam/ios/build/Build/Products -maxdepth 2 -name "*.app" | head -1)
          echo "app: $APP"
          bash qa/native/ios.sh "$APP" qa-out/ios
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tt-ios
          path: qa-out
          if-no-files-found: ignore

  apk:
    name: Bản cài Android (APK) cho người dùng
    needs: [prep, check]
    if: always() && needs.prep.result == 'success' && (needs.check.result == 'success' || needs.check.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prep.outputs.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci --no-audit --no-fund
      - name: Số phiên bản theo lượt chạy (để cài đè bản cũ được)
        run: node .github/scripts/tt-version.mjs "${{ github.run_number }}"
      - name: Prebuild (không kèm màn nạp dữ liệu kiểm thử)
        run: |
          rm -f apps/thanh-tam/app/qa-seed.tsx
          $A "prebuild android" "cd apps/thanh-tam && npx expo prebuild -p android --clean --no-install 2>&1 | tail -20"
          bash .github/scripts/gradle-dist.sh apps/thanh-tam/android
      # Mỗi bản chỉ chứa thư viện của một kiểu chip: arm64 cho gần như mọi máy từ 2017, arm32 cho máy rất cũ.
      # Bỏ x86_64 (chỉ máy ảo dùng). Gộp 3 kiểu chip vào một tệp từng làm bản cài nặng 97 MB.
      - name: Build APK arm64 (gần như mọi điện thoại)
        run: |
          $A "gradle arm64" "bash .github/scripts/gradle-retry.sh apps/thanh-tam/android assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon -q"
          cp apps/thanh-tam/android/app/build/outputs/apk/release/app-release.apk ThanhTam.apk
      - name: Build APK arm32 (máy rất cũ)
        run: |
          $A "gradle arm32" "bash .github/scripts/gradle-retry.sh apps/thanh-tam/android assembleRelease -PreactNativeArchitectures=armeabi-v7a --no-daemon -q"
          cp apps/thanh-tam/android/app/build/outputs/apk/release/app-release.apk ThanhTam-may-cu.apk
      - name: Ngân sách dung lượng (xem apps/thanh-tam/CLAUDE.md)
        run: node .github/scripts/tt-apk-size.mjs ThanhTam.apk 40 ThanhTam-may-cu.apk 35
      - name: Quyền máy bản phát hành (khai ở Google Play)
        run: |
          AAPT=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | tail -1)
          "$AAPT" dump permissions ThanhTam.apk | tee permissions.txt
          # Quyền app không dùng thì không được có (Google Play hỏi lý do, chính sách riêng tư nói không xin)
          if grep -E "RECORD_AUDIO|SYSTEM_ALERT_WINDOW|EXTERNAL_STORAGE|FOREGROUND_SERVICE|c2dm|INSTALL_REFERRER" permissions.txt; then
            echo "::error::Bản phát hành có quyền thừa ở trên; chặn trong app.json (android.blockedPermissions)"
            exit 1
          fi
      # Google Play: gói AAB ký bằng khóa tải lên. APK ở Releases vẫn ký khóa thử để cài đè bản cũ không mất dữ liệu.
      - name: Có khóa ký Google Play chưa
        id: sign
        env:
          K: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          J: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$K" ]; then echo "ok=1" >>"$GITHUB_OUTPUT"; else echo "ok=0" >>"$GITHUB_OUTPUT"; echo "::notice::Chưa có secret ANDROID_UPLOAD_KEYSTORE_B64: bỏ qua gói AAB cho Google Play"; fi
          if [ -n "$J" ]; then echo "play=1" >>"$GITHUB_OUTPUT"; else echo "play=0" >>"$GITHUB_OUTPUT"; fi
      - name: Build AAB cho Google Play (ký khóa tải lên)
        if: steps.sign.outputs.ok == '1'
        env:
          ANDROID_UPLOAD_KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
          ANDROID_UPLOAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          python3 .github/scripts/tt-signing.py apps/thanh-tam/android
          $A "gradle aab" "bash .github/scripts/gradle-retry.sh apps/thanh-tam/android bundleRelease -PreactNativeArchitectures=arm64-v8a,armeabi-v7a --no-daemon -q"
          cp apps/thanh-tam/android/app/build/outputs/bundle/release/app-release.aab ThanhTam.aab
          ls -la ThanhTam.aab
          keytool -printcert -jarfile ThanhTam.aab | grep -E "Owner|SHA256" | head -3
      - name: Đẩy lên Google Play (${{ inputs.play_track || 'internal' }})
        if: steps.sign.outputs.ok == '1' && steps.sign.outputs.play == '1' && github.event_name == 'workflow_dispatch'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: vn.namapp.thanhtam
          releaseFiles: ThanhTam.aab
          track: ${{ inputs.play_track || 'internal' }}
          status: ${{ inputs.play_status || 'draft' }}
          inAppUpdatePriority: 2
          whatsNewDirectory: apps/thanh-tam/store/android/whatsnew
          mappingFile: apps/thanh-tam/android/app/build/outputs/mapping/release/mapping.txt
      - name: Đăng lên GitHub Releases (thanh-tam-latest)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ needs.prep.outputs.sha }}
          RUN: ${{ github.run_number }}
        run: |
          FILES="ThanhTam.apk ThanhTam-may-cu.apk"
          [ -f ThanhTam.aab ] && FILES="$FILES ThanhTam.aab"
          sha256sum $FILES | tee SHA256SUMS.txt
          {
            echo "Bản cài Android mới nhất của Thành Tâm (lượt $RUN, commit $SHA)."
            echo ""
            echo "- ThanhTam.apk: dùng cho gần như mọi điện thoại Android (máy từ khoảng 2017 trở lại đây)."
            echo "- ThanhTam-may-cu.apk: chỉ dùng khi máy báo không cài được bản trên (máy rất cũ, chip 32-bit)."
            echo ""
            echo "Cài: mở link tải trên điện thoại Android, mở tệp vừa tải, cho phép cài từ nguồn này nếu máy hỏi."
            echo "Bản thử nghiệm. Bản sau cài đè lên bản trước, giữ nguyên dữ liệu."
            [ -f ThanhTam.aab ] && echo "- ThanhTam.aab: gói gửi lên Google Play (không cài trực tiếp được)."
          } > notes.md
          cat apk-size.md >> notes.md
          gh release delete thanh-tam-latest --cleanup-tag -y || true
          gh release create thanh-tam-latest $FILES SHA256SUMS.txt permissions.txt --target "$SHA" --prerelease --title "Thành Tâm cho Android (bản thử)" --notes-file notes.md
      - uses: actions/upload-artifact@v4
        with:
          name: apk-thanh-tam
          path: |
            ThanhTam.apk
            apk-size.md
          retention-days: 14

  publish:
    name: Gom kết quả
    needs: [prep, check, web, android, ios]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: results
          pattern: tt-*
          merge-multiple: true
      - name: Thu nhỏ ảnh (PNG máy ảo nặng, đẩy lên dễ quá thời gian HTTP 408)
        run: |
          sudo apt-get install -y -qq imagemagick >/dev/null 2>&1 || true
          find results -name "*.png" -size +200k -print0 | xargs -0 -r -P 4 -n 20 mogrify -resize "1200x1200>" -quality 70 -format jpg
          find results -name "*.png" -size +200k | while read -r f; do [ -f "${f%.png}.jpg" ] && rm "$f"; done
          # Nhật ký Simulator của Maestro có thể tới 150 MB/tệp: GitHub chặn tệp > 100 MB. Ảnh đã chép ra shots/.
          rm -rf results/ios/maestro-out
          find results -type f -size +20M -print -delete
          du -sh results
      - name: Đẩy lên nhánh qa-results-tt
        run: |
          git config --global http.postBuffer 524288000
          cd results
          {
            echo "# Thành Tâm QA · run ${{ github.run_id }} · ${{ needs.prep.outputs.sha }}"
            echo "check=${{ needs.check.result }} web=${{ needs.web.result }} android=${{ needs.android.result }} ios=${{ needs.ios.result }}"
          } > RUN.md
          git init -q -b qa-results-tt
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "qa: Thành Tâm (run ${{ github.run_id }})"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" qa-results-tt
