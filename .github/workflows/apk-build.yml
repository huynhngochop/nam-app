# Build 4 file APK cài thử (release, biến thể preview, ký bằng khóa debug) — không cần EXPO_TOKEN.
# Chạy mỗi lần main đổi mã app; APK được đẩy lên nhánh apk-builds (tải trực tiếp từ GitHub).
# Có .github/release-notes/v<phiên bản>.md thì tạo thêm GitHub Release kèm 4 APK (một lần cho mỗi phiên bản).
# Bản lên Google Play vẫn build bằng EAS (eas-build.yml, cần EXPO_TOKEN và khóa ký thật).
name: APK cài thử

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['apps/**', 'packages/**', 'package-lock.json', '.github/workflows/apk-build.yml', '.github/release-notes/**']

permissions:
  contents: write

concurrency:
  group: apk-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: Build ${{ matrix.app }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        app: [vi-gon, hen-dep, nhip, meo-nha]
    env:
      A: node .github/scripts/annotate.mjs
      EXPO_PUBLIC_APP_VARIANT: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --no-audit --no-fund
      - name: Prebuild
        run: $A "prebuild ${{ matrix.app }}" "cd apps/${{ matrix.app }} && npx expo prebuild -p android --no-install --clean 2>&1 | tail -20"
      # Kiến trúc theo packages/core/plugins/with-android-release.js: armeabi-v7a + arm64-v8a (mọi điện thoại Android thật).
      # Mỗi loại chip một APK (nam.abiSplits trong packages/core/plugins/with-android-release.js).
      - name: Gradle assembleRelease
        run: $A "gradle ${{ matrix.app }}" "cd apps/${{ matrix.app }}/android && ./gradlew :app:assembleRelease -Pnam.abiSplits=true --no-daemon -q 2>&1 | grep -v '^w:' | tail -40"
      - name: Đặt tên APK
        run: |
          v=$(node -p "require('./apps/${{ matrix.app }}/app.json').expo.version")
          d=apps/${{ matrix.app }}/android/app/build/outputs/apk/release
          mkdir -p out
          # arm64-v8a: gần như mọi điện thoại từ 2017; armeabi-v7a: máy 32-bit đời cũ.
          cp "$d/app-arm64-v8a-release.apk" "out/${{ matrix.app }}-$v-preview.apk"
          cp "$d/app-armeabi-v7a-release.apk" "out/${{ matrix.app }}-$v-preview-armv7.apk"
          echo "::notice title=${{ matrix.app }}::v$v · arm64 $(du -k out/${{ matrix.app }}-$v-preview.apk | cut -f1) KB · armv7 $(du -k out/${{ matrix.app }}-$v-preview-armv7.apk | cut -f1) KB"
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.app }}
          path: out/*.apk

  publish:
    needs: apk
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: apks
          pattern: apk-*
          merge-multiple: true
      - uses: actions/checkout@v4
        with:
          path: src
          sparse-checkout: |
            .github/release-notes
            apps/vi-gon/app.json
      # Tạo GitHub Release vX.Y.Z (kèm tag) khi main có ghi chú .github/release-notes/vX.Y.Z.md cho phiên bản
      # hiện tại trong app.json mà release đó chưa có. Đổi số phiên bản + thêm ghi chú = ra bản mới.
      - name: Tạo GitHub Release
        if: needs.apk.result == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          tag="v$(node -p "require('./src/apps/vi-gon/app.json').expo.version")"
          notes="src/.github/release-notes/$tag.md"
          if [ ! -f "$notes" ]; then echo "Chưa có ghi chú cho $tag, bỏ qua."; exit 0; fi
          if gh release view "$tag" --repo "$REPO" > /dev/null 2>&1; then echo "$tag đã có, bỏ qua."; exit 0; fi
          gh release create "$tag" apks/*.apk --repo "$REPO" --target "${{ github.sha }}" --title "$tag" --notes-file "$notes"
          echo "::notice title=release::đã tạo $tag"
      - name: Đẩy lên nhánh apk-builds
        run: |
          cd apks
          ls -la
          printf '# APK cài thử\n\nBản preview (mã thử Hẹn Đẹp: 123456, mua trong app giả lập), ký bằng khóa debug — chỉ để cài thử, không đưa lên cửa hàng.\n\n- `<app>-<phiên bản>-preview.apk`: điện thoại 64-bit (gần như mọi máy từ 2017).\n- `…-preview-armv7.apk`: máy 32-bit đời cũ, nếu bản trên báo không cài được.\n\nBuild từ commit %s.\n' "${{ github.sha }}" > README.md
          git init -q -b apk-builds
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "APK cài thử (run ${{ github.run_id }}, ${{ github.sha }})"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:apk-builds
