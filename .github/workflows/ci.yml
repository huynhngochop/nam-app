# Kiểm tra mọi pull request và mọi lần đẩy lên main: lint, định dạng, kiểu, test.
# Mỗi bước đẩy phần cuối output thành annotation để xem lỗi ngay trên trang Checks.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint · format · typecheck · test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: node .github/scripts/annotate.mjs "lint" npm run lint
      - name: Định dạng (Prettier)
        run: node .github/scripts/annotate.mjs "format" npm run format:check
      - name: Typecheck
        run: node .github/scripts/annotate.mjs "typecheck" npm run typecheck
      - name: Test
        run: node .github/scripts/annotate.mjs "test" npm test
