# Build APK (profile "preview") cho cả 4 app bằng EAS.
# Cần secret EXPO_TOKEN: Settings → Secrets and variables → Actions → New repository secret.
# Tạo token tại https://expo.dev/settings/access-tokens
name: EAS build Android (preview)

on:
  workflow_dispatch:
  push:
    branches: [main, ci/eas-build-android] # TẠM: nhánh PR, bỏ trước khi merge

concurrency:
  group: eas-build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Typecheck + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  build:
    name: APK ${{ matrix.app }}
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        app: [meo-nha, nhip, hen-dep, vi-gon]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - name: Kiểm tra secret EXPO_TOKEN
        working-directory: .
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          if [ -z "$EXPO_TOKEN" ]; then
            echo "::error title=Thiếu EXPO_TOKEN::Thêm secret EXPO_TOKEN vào repo (Settings → Secrets and variables → Actions). Tạo token tại https://expo.dev/settings/access-tokens"
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Cài thư viện
        working-directory: .
        run: npm ci --no-audit --no-fund

      - name: eas build (Android, preview)
        run: eas build --platform android --profile preview --non-interactive
