plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'vn.namapp.hendep.ocr'
version = '0.1.0'

android {
  namespace "vn.namapp.hendep.ocr"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

dependencies {
  // Bản dùng Google Play services: mô hình tải về lần đầu (APK không nặng thêm vài MB), chạy hoàn toàn trên máy.
  implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.1'
}
