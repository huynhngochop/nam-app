# Workflow TẠM (xóa trước khi merge): cài ESLint/Prettier, cập nhật lockfile, định dạng toàn repo,
# chạy lint --fix, rồi commit ngược về nhánh (mỗi bước một commit để dễ review).
name: tooling bootstrap (tạm)

on:
  push:
    branches: [chore/lint-ci-otp]
    paths: ['.github/workflows/tooling-bootstrap.yml', '.github/bootstrap-trigger']

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    env:
      A: node .github/scripts/annotate.mjs
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"

      - name: npm install (cập nhật lockfile)
        run: |
          $A "npm install" npm install --no-audit --no-fund
          git add package.json package-lock.json
          git diff --cached --quiet || git commit -qm "chore: cài ESLint, eslint-config-expo, Prettier (lockfile)"

      - name: Prettier --write
        run: |
          $A "format" "npm run format 2>&1 | tail -5"
          git add -A .
          git diff --cached --quiet || git commit -qm "style: định dạng toàn repo bằng Prettier (chỉ đổi khoảng trắng/xuống dòng)"

      - name: ESLint --fix
        continue-on-error: true
        run: |
          npx eslint . --fix >/dev/null 2>&1 || true
          git add -A .
          git diff --cached --quiet || git commit -qm "fix: áp dụng eslint --fix"

      - name: Báo cáo lint
        continue-on-error: true
        run: $A "lint" "npx eslint . -f unix 2>&1 | tail -150; npx eslint . >/dev/null 2>&1"

      - name: format:check
        continue-on-error: true
        run: $A "format:check" npm run format:check

      - name: typecheck
        continue-on-error: true
        run: $A "typecheck" npm run typecheck

      - name: test
        continue-on-error: true
        run: $A "test" "npm test 2>&1 | tail -12"

      - name: Đẩy commit
        run: git push
