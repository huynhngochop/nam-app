# Build Android thật (prebuild + Gradle, bản release, chỉ arm64) cho 4 app — không cần EXPO_TOKEN.
# Mục đích: biên dịch module native (vd. bộ đọc thông báo Ví Gọn) và đo dung lượng APK sau mỗi thay đổi thư viện.
name: Android native build

on:
  workflow_dispatch:
  # Mọi thay đổi mã app / thư viện / tài nguyên đều có thể đổi dung lượng → luôn đo và kiểm ngân sách.
  pull_request:
    paths:
      - 'apps/**'
      - 'packages/**'
      - 'package-lock.json'
      - '.github/apk-budget.json'
      - '.github/scripts/**'
      - '.github/workflows/android-native.yml'

concurrency:
  group: android-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    name: APK ${{ matrix.app }}
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        app: [vi-gon, hen-dep, nhip, meo-nha]
    env:
      A: node .github/scripts/annotate.mjs
      EXPO_PUBLIC_APP_VARIANT: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: npm ci --no-audit --no-fund

      - name: Prebuild
        run: $A "prebuild ${{ matrix.app }}" "cd apps/${{ matrix.app }} && npx expo prebuild -p android --no-install --clean 2>&1 | tail -20"

      - name: Gradle assembleRelease (arm64)
        run: $A "gradle ${{ matrix.app }}" "cd apps/${{ matrix.app }}/android && ./gradlew :app:assembleRelease -PreactNativeArchitectures=arm64-v8a --no-daemon -q 2>&1 | grep -v '^w:' | tail -40"

      - name: Dung lượng APK + kiểm tra manifest
        run: |
          apk=$(ls apps/${{ matrix.app }}/android/app/build/outputs/apk/release/*.apk | head -1)
          size=$(du -k "$apk" | cut -f1)
          # Module native cục bộ (apps/<app>/modules) có được autolink và vào manifest cuối không.
          svc=$(grep -rl BankNotificationService apps/${{ matrix.app }}/android/app/build/intermediates --include=AndroidManifest.xml | head -3 | tr '\n' ' ')
          echo "::notice title=APK ${{ matrix.app }}::${size} KB (arm64, release) · NotificationListener: ${svc:-không có}"
      - name: Ngân sách dung lượng (docs/lean-app.md)
        run: bash .github/scripts/apk-budget.sh "${{ matrix.app }}" "$(ls apps/${{ matrix.app }}/android/app/build/outputs/apk/release/*.apk | head -1)"

      # Máy ảo x86_64 không nạp được thư viện arm64 của React Native: build thêm bản x86_64 chỉ để mở thử.
      - name: Gradle assembleRelease (x86_64, để mở thử)
        run: $A "gradle x86 ${{ matrix.app }}" "cd apps/${{ matrix.app }}/android && ./gradlew :app:assembleRelease -PreactNativeArchitectures=x86_64 --no-daemon -q 2>&1 | grep -v '^w:' | tail -20"
      - name: Đường dẫn APK x86_64
        run: |
          echo "APK=$(ls apps/${{ matrix.app }}/android/app/build/outputs/apk/release/*.apk | head -1)" >> "$GITHUB_ENV"
          echo "PKG=$(node -p "require('./apps/${{ matrix.app }}/app.json').expo.android.package")" >> "$GITHUB_ENV"

      # Mở thử trên máy ảo.
      - name: Bật KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Mở thử APK trên máy ảo
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: bash .github/scripts/smoke-apk.sh "${{ env.APK }}" "${{ env.PKG }}" "apps/${{ matrix.app }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.app }}
          path: smoke-*.png
          if-no-files-found: ignore
